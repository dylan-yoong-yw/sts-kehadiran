name: Flutter CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter-checks:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test